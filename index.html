<!DOCTYPE html>
<html>
<head>
    <title>Vixela Mod Panel</title>
    <style>
        body { background-image: url('https://eyb61.github.io/vixela-mod-panel/Vixela%20Banner.gif'); background-size: cover; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; font-family: sans-serif; }
        .card { background: rgba(0,0,0,0.85); padding: 40px; border: 2px solid red; border-radius: 20px; backdrop-filter: blur(10px); text-align: center; width: 300px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: red; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:red">MOD PANEL</h2>
        <input type="text" id="u" placeholder="Kullanıcı Adı">
        <input type="password" id="p" placeholder="Şifre">
        <button onclick="login()">GİRİŞ YAP</button>
    </div>
    <script>
        async function login() {
            const user = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            const res = await fetch('https://SENIN-NGROK-ADRESIN.ngrok-free.app/api/login-mod', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user, pass})
            });
            const data = await res.json();
            if(data.success) window.location.href = "panel.html"; else alert("Hatalı!");
        }
    </script>
</body>
</html>
